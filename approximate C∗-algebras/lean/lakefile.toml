name = "kitaev_rigidity"
version = "1.0.0"
defaultTargets = ["Certs", "LeanProof"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

# The two audited certificates (Theorem A: KitaevChannels, Theorem B: KitaevSectors).
[[lean_lib]]
name = "Certs"
globs = ["Certs.+"]

# The earlier project: definitions, the inverse bound and graded rigidity.
# Built with the options it was written under.
[[lean_lib]]
name = "LeanProof"
leanOptions = { autoImplicit = true, maxSynthPendingDepth = 3 }
